<div class="song1"> 
    <div class="tab">
        

       <div class="th">
           <h1 id="Lyrics">Lyrics</h1>

       </div>
    </div>
</div>

<script>
    const playButton = document.getElementById("playbutton");
    const audioPlayer = document.getElementById("audioplayer");
    const progress = document.getElementById("progress");
    const lyricsDisplay = document.getElementById("lyricsDisplay");
    const playIcon = "play.png";
    const pauseIcon = "pause.png";

    const lyricData = [
        { time: 0, text: "" },
        { time: 17, text: "Tuwing umaga, ikaw ang naiisip ko" },
        { time: 21, text: "Sa simpleng ngiti mo, puso ko'y sumisilip" },
        { time: 25, text: "Kahit walang sabihin, sapat nang kapiling ka" },
        { time: 29, text: "Dahil sa piling mo, kumpleto na ang mundo ko" },
        { time: 32, text: "Sa bawat kwento ng araw na lumilipas" },
        { time: 36, text: "Ikaw ang gusto kong makasama hanggang bukas" },
        { time: 40, text: "Hindi kailangan ng mamahaling bagay" },
        { time: 43, text: "Basta't ikaw ang katabi ko habang buhay" },
        { time: 47, text: "At sa bawat sandali na tayo'y magkasama" },
        { time: 51, text: "Parang humihinto ang ikot ng mundo" },
        { time: 54, text: "Kung may isang bagay akong hihilingin" },
        { time: 58, text: "Sana'y ikaw hanggang sa dulo" },
        { time: 63, text: "Sa'yo lang, puso ko'y nahulog" },
        { time: 67, text: "Sa'yo lang, pag-ibig ko'y buo" },
        { time: 71, text: "Ikaw ang dahilan ng aking ngiti" },
        { time: 75, text: "Ang tahanan ng puso kong naghihintay" },
        { time: 78, text: "Kahit saan man tayo dalhin ng panahon" },
        { time: 82, text: "Hawak ang kamay mo, hindi ako susuko" },
        { time: 86, text: "Sa bawat bukas, sa bawat ngayon" },
        { time: 89, text: "Ikaw ang pipiliin ko" },
        { time: 110, text: "Gusto kong kasama ka sa bawat umaga" },
        { time: 113, text: "Kahit simpleng kape lang, basta't ikaw kasama" },
        { time: 117, text: "Kapag pagod ka, ako ang iyong pahinga" },
        { time: 121, text: "Kapag malungkot ka, ako'y nandito sa tabi mo" },
        { time: 125, text: "At kung minsan ay may hindi tayo pagkakaunawaan" },
        { time: 128, text: "Hahayaan nating lumipas, sabay tayong lalaban" },
        { time: 132, text: "Dahil ang mahalaga sa ating dalawa" },
        { time: 135, text: "Ay hindi ang perpekto, kundi ang manatili tayo" },
        { time: 139, text: "Hindi ko man kayang ibigay ang mundo" },
        { time: 143, text: "Ibibigay ko naman ang puso ko sa'yo" },
        { time: 146, text: "At habang may bukas na naghihintay" },
        { time: 150, text: "Mamahalin kita nang walang katapusan" },
        { time: 155, text: "Sa'yo lang, puso ko'y nahulog" },
        { time: 159, text: "Sa'yo lang, pag-ibig ko'y buo" },
        { time: 163, text: "Ikaw ang dahilan ng aking ngiti" },
        { time: 167, text: "Ang tahanan ng puso kong naghihintay" },
        { time: 171, text: "Kahit saan man tayo dalhin ng panahon" },
        { time: 174, text: "Hawak ang kamay mo, hindi ako susuko" },
        { time: 178, text: "Sa bawat bukas, sa bawat ngayon" },
        { time: 182, text: "Ikaw ang pipiliin ko" },
        { time: 186, text: "Kung dumating ang araw na tayo'y matanda na" },
        { time: 189, text: "Sana hawak ko pa rin ang kamay mo" },
        { time: 193, text: "At sa bawat kwentong ating babalikan" },
        { time: 196.5, text: "Masasabi kong ikaw ang pinakamagandang desisyon" },
        { time: 203, text: "Sa'yo lang, puso ko'y mananatili" },
        { time: 207, text: "Sa'yo lang, hanggang sa huling sandali" },
        { time: 211, text: "Ikaw ang pangarap na naging totoo" },
        { time: 215, text: "Ang biyayang hindi ko kailanman bibitawan" },
        { time: 218, text: "Kahit ilang taon pa ang lumipas" },
        { time: 222, text: "Ikaw pa rin ang gusto kong kasama" },
        { time: 226, text: "Sa bawat tibok ng puso kong ito" },
        { time: 230, text: "Ikaw lang, ikaw lang ang mahal ko" },
        { time: 239, text: "Ikaw lang, ikaw lang ang mahal" },
        { time: 243, text: "Ikaw lang, ikaw lang ang mahal" },

    ];

    lyricsDisplay.innerHTML = lyricData
        .map((lyric, index) => `<div class="lyric-line" data-index="${index}">${lyric.text}</div>`)
        .join("");

    function updateLyrics() {
        const currentTime = audioPlayer.currentTime;
        const lyricLines = Array.from(document.querySelectorAll(".lyric-line"));
        let activeIndex = 0;

        for (let i = 0; i < lyricData.length; i++) {
            if (currentTime >= lyricData[i].time) {
                activeIndex = i;
            } else {
                break;
            }
        }

        lyricLines.forEach((line, index) => {
            const isActive = index === activeIndex;
            const isPassed = index < activeIndex;
            line.classList.toggle("active", isActive);
            line.classList.toggle("passed", isPassed && !isActive);
        });

        const activeLine = lyricLines[activeIndex];
        if (activeLine) {
            const targetScroll = Math.max(
                0,
                Math.min(activeLine.offsetTop - 80, lyricsDisplay.scrollHeight - lyricsDisplay.clientHeight)
            );

            if (Math.abs(lyricsDisplay.scrollTop - targetScroll) > 8) {
                lyricsDisplay.scrollTo({ top: targetScroll, behavior: "smooth" });
            }
        }
    }

    audioPlayer.onloadedmetadata = function () {
        progress.max = audioPlayer.duration;
        progress.value = audioPlayer.currentTime;
    };

    audioPlayer.addEventListener("timeupdate", function () {
        progress.value = audioPlayer.currentTime;
        updateLyrics();
    });

    playButton.addEventListener("click", function () {
        if (audioPlayer.paused) {
            audioPlayer.play();
            playButton.style.backgroundImage = `url(${pauseIcon})`;
        } else {
            audioPlayer.pause();
            playButton.style.backgroundImage = `url(${playIcon})`;
        }
    });

    document.addEventListener("keydown", function (event) {
        if (event.code === "Space" || event.key === " ") {
            event.preventDefault();
            if (audioPlayer.paused) {
                audioPlayer.play();
                playButton.style.backgroundImage = `url(${pauseIcon})`;
            } else {
                audioPlayer.pause();
                playButton.style.backgroundImage = `url(${playIcon})`;
            }
        }
    });

    progress.addEventListener("input", function () {
        audioPlayer.currentTime = Number(progress.value);
        updateLyrics();
    });

    audioPlayer.addEventListener("ended", function () {
        playButton.style.backgroundImage = `url(${playIcon})`;
        window.location.href = "Paraluman.html";
    });
</script>
