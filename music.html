<script>
    function openPage() {
        const query = document.getElementById("search").value.toLowerCase();
        const songs = document.querySelectorAll('.th');
        const resultsContainer = document.getElementById("search-results");
        const resultsTab = document.getElementById("results-tab");

        resultsTab.innerHTML = "";
        let found = false;

        if (query.trim() === "") {
            resultsContainer.style.display = "none";
            songs.forEach(song => song.style.display = "flex");
            return;
        }
       

        songs.forEach(song => {
            const title = song.querySelector('b').textContent.toLowerCase();
            const artist = song.querySelector('font[color="gray"]').textContent.toLowerCase();
            

            if (title.includes(query) || artist.includes(query)) {
                const clonedSong = song.cloneNode(true); 
                resultsTab.appendChild(clonedSong); 
                found = true;
            }
        });

        if (found) {
            resultsContainer.style.display = "block"; 
           window.location.href="#search-results"
        } else {
           
        }
    }
</script>
